name: LARPTool Build

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'LARPTool/**'
      - '.github/workflows/larptool_build.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: LARPTool

jobs:
  build:
    name: Build LARPTool dylib
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install Theos
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/theos
          sudo chown -R "$USER" /opt/theos
          git clone --depth=1 --recursive https://github.com/theos/theos /opt/theos
          git clone --depth=1 https://github.com/theos/sdks /tmp/theos-sdks
          cp -r /tmp/theos-sdks/iPhoneOS*.sdk /opt/theos/sdks/ || true
          rm -rf /tmp/theos-sdks

      - name: Install ldid and Theos dependencies
        run: |
          brew install ldid || true
          echo "ldid path: $(which ldid || true)"

      - name: Set Theos env
        run: |
          echo "THEOS=/opt/theos" >> "$GITHUB_ENV"
          echo "/opt/theos/bin"   >> "$GITHUB_PATH"


      - name: Create Dobby stub
        run: |
          mkdir -p /opt/theos/lib /opt/theos/include
          cat > /opt/theos/include/dobby.h << 'DOBBY_STUB'
          #pragma once
          #include <stdint.h>
          #ifdef __cplusplus
          extern "C" {
          #endif
          static inline int DobbyHook(void *addr, void *new_func, void **old_func) {
              (void)addr; (void)new_func; (void)old_func; return 0;
          }
          static inline void *DobbySymbolResolver(const char *img, const char *sym) {
              (void)img; (void)sym; return 0;
          }
          #ifdef __cplusplus
          }
          #endif
          DOBBY_STUB

      - name: Vendor ImGui
        run: |
          set -euo pipefail
          IMGUI_TAG="v1.90.8"
          rm -rf imgui /tmp/imgui-src
          git clone --depth=1 --branch "${IMGUI_TAG}" https://github.com/ocornut/imgui /tmp/imgui-src
          mkdir -p imgui
          cp /tmp/imgui-src/imgui*.h imgui/
          cp /tmp/imgui-src/imgui*.cpp imgui/
          cp /tmp/imgui-src/imconfig.h imgui/
          cp /tmp/imgui-src/imstb_*.h imgui/
          cp /tmp/imgui-src/backends/imgui_impl_metal.h imgui/
          cp /tmp/imgui-src/backends/imgui_impl_metal.mm imgui/
          cp /tmp/imgui-src/backends/imgui_impl_osx.h imgui/
          cp /tmp/imgui-src/backends/imgui_impl_osx.mm imgui/

          cat > imgui/imgui_impl_uikit.h << 'IMGUI_UIKIT_H'
          #pragma once
          #include "imgui.h"
          #ifdef __OBJC__
          @class UIView;
          IMGUI_API bool ImGui_ImplUIKit_Init(UIView *view);
          IMGUI_API void ImGui_ImplUIKit_Shutdown();
          IMGUI_API void ImGui_ImplUIKit_NewFrame();
          #endif
          IMGUI_UIKIT_H
          cat > imgui/imgui_impl_uikit.mm << 'IMGUI_UIKIT_MM'
          #import "imgui_impl_uikit.h"
          #import "imgui.h"
          #import <UIKit/UIKit.h>
          bool ImGui_ImplUIKit_Init(UIView *) { return true; }
          void ImGui_ImplUIKit_Shutdown() {}
          void ImGui_ImplUIKit_NewFrame() {
              ImGuiIO &io = ImGui::GetIO();
              CGSize sz = [UIScreen mainScreen].bounds.size;
              io.DisplaySize = ImVec2((float)sz.width, (float)sz.height);
              io.DisplayFramebufferScale = ImVec2(
                  (float)[UIScreen mainScreen].nativeScale,
                  (float)[UIScreen mainScreen].nativeScale);
          }
          IMGUI_UIKIT_MM

      - name: Build LARPTool
        run: |
          set -euo pipefail
          export THEOS=/opt/theos
          export ARCHS=arm64
          make package \
            THEOS=/opt/theos \
            ARCHS=arm64 \
            TARGET="iphone:clang:latest:14.0" \
            FINALPACKAGE=1 \
            STRIP=1 \
            -j$(sysctl -n hw.ncpu) 2>&1 | tee build.log

      - name: Extract dylib
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          DYLIB=$(find .theos/obj/ -name "LARPTool.dylib" | head -1 || true)
          if [ -z "$DYLIB" ]; then
            DYLIB=$(find . -name "LARPTool.dylib" | head -1 || true)
          fi
          if [ -z "$DYLIB" ]; then
            echo "Searching all dylibs:"
            find . -name "*.dylib" || true
            exit 1
          fi
          cp "$DYLIB" "$GITHUB_WORKSPACE/artifacts/LARPTool.dylib"
          echo "Built successfully:"
          ls -lh "$GITHUB_WORKSPACE/artifacts/LARPTool.dylib"
          file "$GITHUB_WORKSPACE/artifacts/LARPTool.dylib"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LARPTool-dylib
          path: ${{ github.workspace }}/artifacts/
          retention-days: 30
          if-no-files-found: error
