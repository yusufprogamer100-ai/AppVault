name: iOS AppVault IPA Derleyici

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: Xcode Surumunu Sec
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Projeyi Derle ve IPA Olustur
        run: |
          set -e
          mkdir -p build/Payload/AppVault.app
          
          # Swift dosyalarini topla
          SWIFT_FILES=$(find AppVault -name "*.swift" ! -path "*/ShieldExtension/*")
          echo "Derlenecek dosyalar: $SWIFT_FILES"

          # Resmi Apple iOS SDK ile ARM64 Binary Derle
          xcrun --sdk iphoneos swiftc $SWIFT_FILES \
            -target arm64-apple-ios16.0 \
            -module-name AppVault \
            -parse-as-library \
            -emit-executable \
            -o build/Payload/AppVault.app/AppVault \
            -framework SwiftUI \
            -framework FamilyControls \
            -framework ManagedSettings \
            -framework Foundation

          # Binary'nin gercekten olustugunu dogrula
          ls -lh build/Payload/AppVault.app/AppVault
          file build/Payload/AppVault.app/AppVault

          # Info.plist ve Entitlements kopyala
          cp AppVault/Info.plist build/Payload/AppVault.app/Info.plist
          cp AppVault/AppVault.entitlements build/Payload/AppVault.app/AppVault.entitlements
          echo -n "APPL????" > build/Payload/AppVault.app/PkgInfo

          # Ad-hoc imzalama (Sideloadly yeniden imzalayacaktir)
          codesign --force --deep --sign - build/Payload/AppVault.app

          # Gercek IPA paketi olustur
          cd build
          zip -r -9 AppVault.ipa Payload
          cd ..
          ls -lh build/AppVault.ipa

      - name: IPA Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: AppVault-IPA
          path: build/AppVault.ipa
